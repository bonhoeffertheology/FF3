<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Fantasy 3 - Mobile Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #121216;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 스마트폰 세로형 스크린 컨테이너 (최대 너비 430px, 세로 전체) */
        #game-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            background-color: #0b0b10;
            border: 4px solid #333344;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* 상단 화면 (월드 / 전투 뷰어) */
        #screen-view {
            flex: 1.2;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            border-bottom: 3px solid #444466;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            overflow: hidden;
        }

        .pixel-art {
            font-size: 4rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        #monster-status {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffcc00;
            text-align: center;
            margin-top: 5px;
            text-shadow: 1px 1px #000;
        }

        /* 중단 상태창 (파티원 현황) */
        #party-status {
            background-color: #111119;
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            border-bottom: 3px solid #444466;
        }

        .party-member {
            background-color: #1a1a24;
            border: 2px solid #3b3b54;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .party-member.active {
            border-color: #ffaa00;
        }

        .hp-bar-bg {
            width: 100%;
            background-color: #333;
            height: 6px;
            border-radius: 3px;
            margin-top: 4px;
            overflow: hidden;
        }

        .hp-bar-fill {
            background-color: #00cc66;
            height: 100%;
            width: 100%;
            transition: width 0.3s ease;
        }

        /* 메시지 / 로그 박스 */
        #message-box {
            flex: 0.8;
            background-color: #0d0d14;
            border: 2px solid #333344;
            margin: 8px;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            line-height: 1.4;
            overflow-y: auto;
            color: #e0e0e5;
        }

        /* 하단 조작 컨트롤러 (커맨드 버튼) */
        #control-panel {
            padding: 10px 8px 16px 8px;
            background-color: #14141e;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            background-color: #26263b;
            color: #ffffff;
            border: 2px solid #4d4d73;
            padding: 12px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: background 0.1s, transform 0.1s;
        }

        .btn:active {
            background-color: #3d3d5c;
            transform: scale(0.97);
        }

        .btn.primary {
            background-color: #4a1515;
            border-color: #993333;
        }

        .btn.primary:active {
            background-color: #662222;
        }

        /* 상단 타이틀 바 */
        #header-title {
            background-color: #07070a;
            color: #ffcc00;
            text-align: center;
            padding: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 2px solid #222233;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="header-title">FINAL FANTASY STYLE RPG</div>
        
        <!-- 시각 화면 -->
        <div id="screen-view">
            <div class="pixel-art" id="enemy-sprite">🐉</div>
            <div id="monster-status">레벨 드래곤 (HP: 120 / 120)</div>
        </div>

        <!-- 파티 스테이터스 -->
        <div id="party-status">
            <div class="party-member active" id="char-0">
                <strong>빛의 전사 (전사)</strong>
                <div>HP: <span id="hp-0">80</span>/80</div>
                <div class="hp-bar-bg"><div class="hp-bar-fill" id="hpbar-0" style="width: 100%;"></div></div>
            </div>
            <div class="party-member" id="char-1">
                <strong>아루스 (흑마법사)</strong>
                <div>HP: <span id="hp-1">55</span>/55</div>
                <div class="hp-bar-bg"><div class="hp-bar-fill" id="hpbar-1" style="width: 100%;"></div></div>
            </div>
        </div>

        <!-- 로그 메시지창 -->
        <div id="message-box" id="log">
            [시스템] 빛의 파괴된 대지에 크리스탈의 빛이 모여듭니다.<br>
            [전투] 야생의 드래곤이 나타났다! 행동을 선택하세요.
        </div>

        <!-- 하단 조작 버튼 -->
        <div id="control-panel">
            <button class="btn primary" onclick="playerAction('attack')">⚔️ 공격</button>
            <button class="btn" onclick="playerAction('magic')">🔥 파이어</button>
            <button class="btn" onclick="playerAction('job')">🛡️ 잡체인지</button>
            <button class="btn" onclick="playerAction('heal')">💊 포션</button>
        </div>
    </div>

    <script>
        // 게임 상태 데이터
        const state = {
            monster: { name: "레벨 드래곤", hp: 120, maxHp: 120, sprite: "🐉" },
            party: [
                { name: "전사", hp: 80, maxHp: 80, job: "전사", atk: 25 },
                { name: "흑마법사", hp: 55, maxHp: 55, job: "흑마법사", atk: 12 }
            ],
            turn: 0
        };

        const logBox = document.getElementById('message-box');

        function appendLog(text) {
            logBox.innerHTML += `<br>${text}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            // 몬스터 UI 갱신
            document.getElementById('monster-status').innerText = `${state.monster.name} (HP: ${state.monster.hp} / ${state.monster.maxHp})`;
            
            // 파티원 UI 갱신
            state.party.forEach((char, idx) => {
                document.getElementById(`hp-${idx}`).innerText = char.hp;
                const percent = Math.max(0, (char.hp / char.maxHp) * 100);
                document.getElementById(`hpbar-${idx}`).style.width = percent + '%';
            });
        }

        function playerAction(type) {
            if (state.monster.hp <= 0) {
                appendLog("[시스템] 이미 처치한 몬스터입니다. 화면을 터치해 새로고침하세요.");
                return;
            }

            let msg = "";
            if (type === 'attack') {
                const damage = state.party[0].atk + Math.floor(Math.random() * 8);
                state.monster.hp -= damage;
                msg = `[전투] 전사의 검격! ${state.monster.name에게} ${damage}의 데미지!`;
            } else if (type === 'magic') {
                const damage = 35 + Math.floor(Math.random() * 15);
                state.monster.hp -= damage;
                msg = `[전투] 흑마법사의 파이어! ${state.monster.name에게} ${damage}의 화염 데미지!`;
            } else if (type === 'job') {
                const jobs = ["전사", "나이트", "닌자", "현자", "마검사"];
                let currentJob = state.party[0].job;
                let nextJob = jobs[(jobs.indexOf(currentJob) + 1) % jobs.length];
                state.party[0].job = nextJob;
                document.querySelector('#char-0 strong').innerText = `빛의 전사 (${nextJob})`;
                msg = `[시스템] 🌟 잡 체인지! 빛의 전사가 [${nextJob}] (으)로 전직했습니다!`;
            } else if (type === 'heal') {
                state.party[0].hp = Math.min(state.party[0].maxHp, state.party[0].hp + 40);
                state.party[1].hp = Math.min(state.party[1].maxHp, state.party[1].hp + 40);
                msg = `[아이템] 하이포션 사용! 파티원 전원의 HP가 회복되었습니다.`;
            }

            appendLog(msg);

            // 몬스터 처치 체크
            if (state.monster.hp <= 0) {
                state.monster.hp = 0;
                appendLog(`🎉 승리! ${state.monster.name}을(를) 토벌했습니다! EXP +150 획득.`);
                document.getElementById('enemy-sprite').innerText = '✨';
                updateUI();
                return;
            }

            // 몬스터 턴 반격
            setTimeout(() => {
                const monsterDmg = 8 + Math.floor(Math.random() * 10);
                const targetIdx = Math.floor(Math.random() * state.party.length);
                state.party[targetIdx].hp = Math.max(0, state.party[targetIdx].hp - monsterDmg);
                appendLog(`⚡ [반격] ${state.monster.name의} 공격! ${state.party[targetIdx].name}이(가) ${monsterDmg}의 피해를 입었다!`);
                
                // 캐릭터 사망 체크
                if (state.party[targetIdx].hp <= 0) {
                    appendLog(`⚠️ [위기] ${state.party[targetIdx].name}이(가) 쓰러졌습니다!`);
                }
                updateUI();
            }, 400);

            updateUI();
        }
    </script>
</body>
</html>
